# CI runs only for release commits (tagged release-*) and manual dispatch,
# per AGENTS.md. Ordinary pushes do not trigger Actions.

name: Gradle CI

on:
  push:
    tags: [ "release-*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Host tests (common suite on JVM)
        run: ./gradlew :portal-sdk:testAndroidHostTest
      - name: Native stub tests (linuxX64 + cinterop)
        run: ./gradlew :portal-sdk:linuxX64Test
      - name: Assemble Android outputs
        run: ./gradlew :portal-sdk:bundleAndroidMainAar :portal-native-android:assembleRelease :samples:android:assembleDebug

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.versions.toml') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # klib compilation only: linking test binaries needs libportaltunnel.a,
      # which is not shipped (native/source-lock.json).
      - name: Compile iOS targets
        run: ./gradlew :portal-sdk:compileKotlinIosArm64 :portal-sdk:compileKotlinIosSimulatorArm64 :portal-sdk:compileKotlinIosX64 :portal-sdk:compileTestKotlinIosSimulatorArm64
